<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="ttl">
  <title id="ttl">kartal &#8212; web developer, izmir</title>

  <defs>
    <!-- window shape, used to clip everything inside -->
    <clipPath id="win">
      <rect x="10" y="8" width="640" height="284" rx="14"/>
    </clipPath>

    <!-- ambient glow behind the content -->
    <radialGradient id="glow" cx="18%" cy="8%" r="85%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8957e5" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity=".45"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#010409" flood-opacity=".55"/>
    </filter>

    <!-- typing masks: a rect whose width grows left-to-right -->
    <clipPath id="type1"><rect x="38" y="78" width="0" height="34">
      <animate attributeName="width" begin="0.35s" dur="0.75s"
               calcMode="discrete" values="0;13;26;39;52;65;78;91;104" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="type2"><rect x="38" y="158" width="0" height="34">
      <animate attributeName="width" begin="2.15s" dur="0.9s"
               calcMode="discrete" values="0;13;26;39;52;65;78;91;104;117;130;143;156" fill="freeze"/>
    </rect></clipPath>

    <!-- one bird, reused: a gliding silhouette -->
    <path id="bird" d="M0,0 C-20,-11 -33,-7 -44,2 C-31,-3 -17,2 0,7 C17,2 31,-3 44,2 C33,-7 20,-11 0,0 Z"/>
  </defs>

  <!-- ─────────── window ─────────── -->
  <rect x="10" y="8" width="640" height="284" rx="14" fill="#0d1117" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <rect x="10" y="8" width="640" height="284" fill="url(#glow)"/>

    <!-- kartal: birds drifting across the background -->
    <g fill="#c9d1d9" opacity=".07">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-80 132" to="760 96" dur="26s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(1.5)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-60 214" to="740 182" dur="34s" begin="-9s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(.85)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-40 84" to="720 62" dur="41s" begin="-22s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(.55)"/>
      </g>
    </g>

    <!-- title bar -->
    <rect x="10" y="8" width="640" height="42" fill="#161b22"/>
    <line x1="10" y1="50" x2="650" y2="50" stroke="#21262d" stroke-width="1"/>
    <circle cx="36" cy="29" r="6" fill="#ff5f57"/>
    <circle cx="58" cy="29" r="6" fill="#febc2e"/>
    <circle cx="80" cy="29" r="6" fill="#28c840"/>
    <text x="330" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13" fill="#6e7681">kartal@izmir: ~</text>

    <!-- ── line 1: typed command ── -->
    <g clip-path="url(#type1)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
      <text x="40" y="103" fill="#7ee787">$</text>
      <text x="63" y="103" fill="#e6edf3">whoami</text>
    </g>

    <!-- ── line 2: output ── -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.45s" fill="freeze"/>
      <text x="40" y="135" fill="#8b949e">kartal <tspan fill="#484f58">&#183;</tspan> web developer <tspan fill="#484f58">&#183;</tspan> izmir, t&#252;rkiye</text>
    </g>

    <!-- ── line 3: typed command ── -->
    <g clip-path="url(#type2)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
      <text x="40" y="183" fill="#7ee787">$</text>
      <text x="63" y="183" fill="#e6edf3">ls ~/stack</text>
    </g>

    <!-- ── line 4: the stack, as chips ── -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.35s" fill="freeze"/>
        <rect x="40" y="203" width="112" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="58" cy="218" r="4" fill="#f0db4f"/>
        <text x="70" y="223" fill="#c9d1d9">javascript</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.30s" dur="0.35s" fill="freeze"/>
        <rect x="162" y="203" width="112" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="180" cy="218" r="4" fill="#3178c6"/>
        <text x="192" y="223" fill="#c9d1d9">typescript</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.35s" fill="freeze"/>
        <rect x="284" y="203" width="76" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="302" cy="218" r="4" fill="#61dafb"/>
        <text x="314" y="223" fill="#c9d1d9">react</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.60s" dur="0.35s" fill="freeze"/>
        <rect x="370" y="203" width="70" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="388" cy="218" r="4" fill="#3c873a"/>
        <text x="400" y="223" fill="#c9d1d9">node</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.75s" dur="0.35s" fill="freeze"/>
        <rect x="450" y="203" width="64" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="468" cy="218" r="4" fill="#264de4"/>
        <text x="480" y="223" fill="#c9d1d9">css</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.90s" dur="0.35s" fill="freeze"/>
        <rect x="524" y="203" width="60" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <circle cx="542" cy="218" r="4" fill="#8892bf"/>
        <text x="554" y="223" fill="#c9d1d9">php</text>
      </g>
    </g>

    <!-- ── line 5: live prompt ── -->
    <g opacity="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
      <animate attributeName="opacity" from="0" to="1" begin="4.35s" dur="0.3s" fill="freeze"/>
      <text x="40" y="268" fill="#7ee787">$</text>
      <rect x="64" y="253" width="11" height="19" fill="#e6edf3">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                 dur="1.1s" begin="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- crisp gradient edge on top of everything -->
  <rect x="10" y="8" width="640" height="284" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
