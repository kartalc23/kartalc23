<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="700" height="315" role="img" aria-labelledby="ttl">
  <title id="ttl">kartal &#8212; web developer, izmir</title>

  <defs>
    <clipPath id="win"><rect x="10" y="8" width="680" height="293" rx="14"/></clipPath>
    <clipPath id="body"><rect x="10" y="51" width="680" height="250"/></clipPath>

    <radialGradient id="glow" cx="16%" cy="6%" r="88%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8957e5" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity=".45"/>
    </linearGradient>

    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#010409" flood-opacity=".55"/>
    </filter>

    <!-- typing masks: width grows one character at a time -->
    <clipPath id="t1"><rect x="38" y="75" width="0" height="34">
      <animate attributeName="width" begin="0.35s" dur="0.7s" fill="freeze"
               calcMode="discrete" values="0;12;23;35;46;58;69;81;96"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="38" y="153" width="0" height="34">
      <animate attributeName="width" begin="2.10s" dur="0.9s" fill="freeze"
               calcMode="discrete" values="0;12;23;35;46;58;69;81;92;104;115;127;140"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="38" y="237" width="0" height="34">
      <animate attributeName="width" begin="4.20s" dur="0.95s" fill="freeze"
               calcMode="discrete" values="0;12;23;35;46;58;69;81;92;104;115;127;138;152"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="38" y="339" width="0" height="34">
      <animate attributeName="width" begin="6.40s" dur="1.05s" fill="freeze"
               calcMode="discrete" values="0;12;23;35;46;58;69;81;92;104;115;127;138;150;161;175"/>
    </rect></clipPath>

    <path id="bird" d="M0,0 C-20,-11 -33,-7 -44,2 C-31,-3 -17,2 0,7 C17,2 31,-3 44,2 C33,-7 20,-11 0,0 Z"/>
  </defs>

  <rect x="10" y="8" width="680" height="293" rx="14" fill="#0d1117" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <rect x="10" y="8" width="680" height="293" fill="url(#glow)"/>

    <!-- kartal: eagles gliding behind the session -->
    <g fill="#c9d1d9" opacity=".07">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-80 155" to="800 118" dur="28s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(1.6)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-60 248" to="780 214" dur="36s" begin="-11s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(.9)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
                          from="-40 92" to="760 72" dur="44s" begin="-25s" repeatCount="indefinite"/>
        <use href="#bird" transform="scale(.55)"/>
      </g>
    </g>

    <!-- ══════ scrolling body ══════ -->
    <g clip-path="url(#body)">
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

        <!-- the session slides up in four steps, each just before new output lands -->
        <animateTransform attributeName="transform" type="translate" dur="10s" fill="freeze"
                          calcMode="spline"
                          keyTimes="0;0.53;0.56;0.62;0.65;0.775;0.80;0.93;0.96;1"
                          keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"
                          values="0 0;0 0;0 -60;0 -60;0 -120;0 -120;0 -180;0 -180;0 -240;0 -240"/>

        <!-- ── whoami ── -->
        <g clip-path="url(#t1)" font-size="19">
          <text x="40" y="100" fill="#7ee787">$</text>
          <text x="63" y="100" fill="#e6edf3">whoami</text>
        </g>
        <g font-size="17" opacity="0">
          <animate attributeName="opacity" begin="1.35s" dur="0.4s" values="0;1" fill="freeze"/>
          <text x="40" y="132" fill="#8b949e">kartal <tspan fill="#484f58">&#183;</tspan> web developer <tspan fill="#484f58">&#183;</tspan> izmir, t&#252;rkiye</text>
        </g>

        <!-- ── ls ~/stack ── -->
        <g clip-path="url(#t2)" font-size="19">
          <text x="40" y="178" fill="#7ee787">$</text>
          <text x="63" y="178" fill="#e6edf3">ls ~/stack</text>
        </g>
        <g font-size="13">
          <g opacity="0"><animate attributeName="opacity" begin="3.15s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="40" y="198" width="112" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="58" cy="213" r="4" fill="#f0db4f"/><text x="70" y="218" fill="#c9d1d9">javascript</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="3.28s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="162" y="198" width="112" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="180" cy="213" r="4" fill="#3178c6"/><text x="192" y="218" fill="#c9d1d9">typescript</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="3.41s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="284" y="198" width="76" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="302" cy="213" r="4" fill="#61dafb"/><text x="314" y="218" fill="#c9d1d9">react</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="3.54s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="370" y="198" width="70" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="388" cy="213" r="4" fill="#3c873a"/><text x="400" y="218" fill="#c9d1d9">node</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="3.67s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="450" y="198" width="64" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="468" cy="213" r="4" fill="#264de4"/><text x="480" y="218" fill="#c9d1d9">css</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="3.80s" dur="0.3s" values="0;1" fill="freeze"/>
            <rect x="524" y="198" width="60" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
            <circle cx="542" cy="213" r="4" fill="#8892bf"/><text x="554" y="218" fill="#c9d1d9">php</text></g>
        </g>

        <!-- ── cat now.txt ── -->
        <g clip-path="url(#t3)" font-size="19">
          <text x="40" y="262" fill="#7ee787">$</text>
          <text x="63" y="262" fill="#e6edf3">cat now.txt</text>
        </g>
        <g font-size="16" fill="#8b949e">
          <g opacity="0"><animate attributeName="opacity" begin="5.30s" dur="0.35s" values="0;1" fill="freeze"/>
            <text x="40" y="294">building interfaces that load fast and</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="5.60s" dur="0.35s" values="0;1" fill="freeze"/>
            <text x="40" y="318">survive contact with real users.</text></g>
        </g>

        <!-- ── npm run build ── -->
        <g clip-path="url(#t4)" font-size="19">
          <text x="40" y="364" fill="#7ee787">$</text>
          <text x="63" y="364" fill="#e6edf3">npm run build</text>
        </g>
        <g font-size="15">
          <g opacity="0"><animate attributeName="opacity" begin="7.55s" dur="0.3s" values="0;1" fill="freeze"/>
            <text x="40" y="398" fill="#3fb950">&#10003;</text>
            <text x="64" y="398" fill="#c9d1d9">compiled successfully</text>
            <text x="340" y="398" fill="#6e7681">1.24s</text></g>
          <g opacity="0"><animate attributeName="opacity" begin="7.90s" dur="0.3s" values="0;1" fill="freeze"/>
            <text x="40" y="422" fill="#3fb950">&#10003;</text>
            <text x="64" y="422" fill="#c9d1d9">0 vulnerabilities found</text>
            <text x="340" y="422" fill="#6e7681">clean</text></g>
        </g>

        <!-- ── progress bar ── -->
        <g opacity="0">
          <animate attributeName="opacity" begin="8.15s" dur="0.25s" values="0;1" fill="freeze"/>
          <rect x="40" y="440" width="300" height="10" rx="5" fill="#21262d"/>
          <rect x="40" y="440" width="0" height="10" rx="5" fill="url(#barfill)">
            <animate attributeName="width" begin="8.20s" dur="1.0s" values="0;300" fill="freeze"/>
          </rect>
          <g font-size="13" fill="#8b949e">
            <text x="356" y="450" opacity="0"><animate attributeName="opacity" begin="8.20s" dur="0.32s" values="0;1;1;0" keyTimes="0;.05;.95;1"/>21%</text>
            <text x="356" y="450" opacity="0"><animate attributeName="opacity" begin="8.52s" dur="0.32s" values="0;1;1;0" keyTimes="0;.05;.95;1"/>58%</text>
            <text x="356" y="450" opacity="0"><animate attributeName="opacity" begin="8.84s" dur="0.32s" values="0;1;1;0" keyTimes="0;.05;.95;1"/>87%</text>
            <text x="356" y="450" fill="#3fb950" opacity="0"><animate attributeName="opacity" begin="9.16s" dur="0.3s" values="0;1" fill="freeze"/>100%</text>
          </g>
        </g>

        <!-- ── live prompt ── -->
        <g opacity="0" font-size="19">
          <animate attributeName="opacity" begin="9.65s" dur="0.3s" values="0;1" fill="freeze"/>
          <text x="40" y="496" fill="#7ee787">$</text>
          <rect x="64" y="481" width="11" height="19" fill="#e6edf3">
            <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                     dur="1.1s" begin="9.95s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- scroll thumb, tracks the slide -->
    <rect x="678" y="62" width="3" height="110" rx="1.5" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" dur="10s" fill="freeze"
               keyTimes="0;0.50;0.55;1" values="0;0;0.30;0.30"/>
      <animate attributeName="y" dur="10s" fill="freeze" calcMode="spline"
               keyTimes="0;0.53;0.56;0.62;0.65;0.775;0.80;0.93;0.96;1"
               keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"
               values="62;62;97;97;132;132;167;167;202;202"/>
    </rect>

    <!-- title bar sits above the scrolling body -->
    <rect x="10" y="8" width="680" height="42" fill="#161b22"/>
    <line x1="10" y1="50" x2="690" y2="50" stroke="#21262d" stroke-width="1"/>
    <circle cx="36" cy="29" r="6" fill="#ff5f57"/>
    <circle cx="58" cy="29" r="6" fill="#febc2e"/>
    <circle cx="80" cy="29" r="6" fill="#28c840"/>
    <text x="350" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13" fill="#6e7681">kartal@izmir: ~</text>
  </g>

  <rect x="10" y="8" width="680" height="293" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
